<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#ff0000">
	<title>Software Solutions</title>
	<script>
		// Welcome screen on every full load of the home page, on phones and small tablets
		// (see src/components/intro/intro-gate.js; keep the width in sync with PHONE_QUERY there).
		// Added before first paint so the page never flashes underneath; ?nointro skips it.
		if (
			location.pathname === '/' &&
			!/[?&]nointro\b/.test(location.search) &&
			window.matchMedia('(max-width: 899px)').matches
		) {
			document.documentElement.classList.add('show-intro');
		}
	</script>
	%sveltekit.head%
	<style>
		* {
			margin: 0;
			font-family: Verdana, Geneva, Tahoma, sans-serif
		}

		/* For Webkit-based browsers (Chrome, Safari) */
		::-webkit-scrollbar {
			width: 0rem;
			height: 0rem;
		}

		::-webkit-scrollbar-thumb {
			background-color: #ff0000;
		}

	</style>
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
